databases:
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
    plan: free
    region: oregon

services:
  - type: web
    name: careconnect-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: JITSI_DOMAIN
        value: meet.jit.si
