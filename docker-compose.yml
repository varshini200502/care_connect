version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: careconnect_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careconnect_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careconnect_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-careconnect_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careconnect_user -d careconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careconnect_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-careconnect_user}:${POSTGRES_PASSWORD:-careconnect_secure_pass_2026}@db:5432/${POSTGRES_DB:-careconnect_db}
      SECRET_KEY: ${SECRET_KEY:-careconnect_super_secret_jwt_key_2026_pediatrics_secure_auth_hash}
      UPLOAD_DIR: /app/uploads
      JITSI_DOMAIN: meet.jit.si
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careconnect_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
